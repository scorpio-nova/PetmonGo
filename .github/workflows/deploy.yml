name: Deploy WeChat Mini Program

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wechat-miniprogram-develop
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: petmon-go-mini/package-lock.json

      - name: Verify upload contract
        run: node petmon-go-mini/tests/ci-upload.test.mjs

      - name: Install dependencies
        working-directory: petmon-go-mini
        run: npm ci --legacy-peer-deps

      - name: Build mini program
        working-directory: petmon-go-mini
        run: npm run build:mp-weixin

      - name: Upload to WeChat
        env:
          MINI_PROGRAM_APPID: ${{ secrets.MINI_PROGRAM_APPID }}
          MINI_PROGRAM_PRIVATE_KEY: ${{ secrets.MINI_PROGRAM_PRIVATE_KEY }}
        run: bash .github/scripts/upload-miniprogram.sh
